name: Arduino Library CI

on:
  push:
    branches: [ "master", "bug-hunt" ]
  pull_request:
    branches: [ "master", "bug-hunt" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the bug-hunt branch from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the official Arduino CLI tool
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Step 3: Install the ESP8266 core required for Wemos boards
      - name: Install ESP8266 Core Platform
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      # Step 3.5: Patch elf2bin.py Syntax Warnings for Python 3.12+
      - name: Patch elf2bin.py Syntax Warnings
        run: |
          ELF2BIN_PATH="$HOME/.arduino15/packages/esp8266/hardware/esp8266/3.1.2/tools/elf2bin.py"
          if [ -f "$ELF2BIN_PATH" ]; then
            sed -i "s/re.split('\s+', line)/re.split(r'\s+', line)/g" "$ELF2BIN_PATH"
          fi

      # Step 4: Symlink this repository into the local Arduino library path
      # This allows the CLI compiler to locate and include your "MPU_D1_mini_lib"
      - name: Install Local Library
        run: |
          mkdir -p $HOME/Arduino/libraries
          ln -s $GITHUB_WORKSPACE $HOME/Arduino/libraries/MPU_D1_mini_lib
          
      # Step 5: Compile all the example sketches to look for bugs.
      # Replace "ExampleName" with the actual folder name inside your /examples directory
      - name: Compile all examples
        run: |
          for example in $HOME/Arduino/libraries/MPU_D1_mini_lib/examples/*; do
            if [ -d "$example" ]; then
              arduino-cli compile --warnings all --fqbn esp8266:esp8266:d1_mini "$example"
            fi
          done
