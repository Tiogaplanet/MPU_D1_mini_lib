name: Deploy Doxygen API Docs to GitHub Wiki

on:
  push:
    branches:
      - master

jobs:
  deploy-wiki:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate Doxygen XML
        run: |
          # Generate default Doxyfile if not present
          if [ ! -f Doxyfile ]; then
            doxygen -g
          fi
          
          # Configure Doxyfile settings for XML generation
          sed -i 's/GENERATE_XML           = NO/GENERATE_XML           = YES/' Doxyfile
          sed -i 's/XML_OUTPUT             = xml/XML_OUTPUT             = xml/' Doxyfile
          sed -i 's/GENERATE_HTML          = YES/GENERATE_HTML          = NO/' Doxyfile
          sed -i 's/GENERATE_LATEX         = YES/GENERATE_LATEX         = NO/' Doxyfile
          sed -i 's/RECURSIVE              = NO/RECURSIVE              = YES/' Doxyfile
          
          # Run Doxygen
          doxygen Doxyfile

      - name: Convert Doxygen XML to Multi-Page Markdown & Sidebar
        run: |
          mkdir -p wiki_markdown
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          import os

          xml_dir = 'xml'
          out_dir = 'wiki_markdown'
          index_path = os.path.join(xml_dir, 'index.xml')

          if not os.path.exists(index_path):
              print("No index.xml found.")
              exit(0)

          def get_text(element):
              """ Recursively extracts clean text from XML elements """
              if element is None:
                  return ""
              return "".join(element.itertext()).strip()

          tree = ET.parse(index_path)
          root = tree.getroot()

          pages = []

          for compound in root.findall('compound'):
              kind = compound.get('kind')
              name = compound.find('name').text
              refid = compound.get('refid')

              if kind in ['class', 'struct', 'header', 'file']:
                  clean_name = name.replace(':', '_').replace('/', '_').replace('.', '_')
                  doc_filename = f"{clean_name}.md"
                  pages.append((name, clean_name, kind))

                  page = [f"# {kind.capitalize()} `{name}`\n\n"]
                  detail_path = os.path.join(xml_dir, f"{refid}.xml")

                  if os.path.exists(detail_path):
                      d_tree = ET.parse(detail_path)
                      d_root = d_tree.getroot()
                      comp_def = d_root.find('compounddef')

                      # --- Class Brief Description ---
                      brief = get_text(comp_def.find('briefdescription'))
                      if brief:
                          page.append(f"{brief}\n\n")

                      # --- Class Detailed Description (@details) ---
                      deta = get_text(comp_def.find('detaileddescription'))
                      if deta:
                          page.append(f"## Detailed Description\n\n{deta}\n\n")

                      # --- Class Members and Functions ---
                      members = comp_def.findall('.//memberdef')
                      if members:
                          page.append("## Public Members & Functions\n\n")

                          for member in members:
                              m_kind = member.get('kind')
                              m_prot = member.get('prot')

                              # Only document public and protected members
                              if m_prot not in ['public', 'protected']:
                                  continue

                              m_name = get_text(member.find('name'))
                              m_type = get_text(member.find('type'))
                              m_args = get_text(member.find('argsstring'))
                              m_brief = get_text(member.find('briefdescription'))
                              m_deta_el = member.find('detaileddescription')

                              # Signature Title
                              sig = f"`{m_type} {m_name}{m_args}`" if m_type else f"`{m_name}{m_args}`"
                              page.append(f"### {m_name}\n\n")
                              page.append(f"**Signature:** {sig}\n\n")

                              if m_brief:
                                  page.append(f"{m_brief}\n\n")

                              # Extract Method @details
                              if m_deta_el is not None:
                                  # Exclude parameterlist/simplesect text from general details
                                  para_text = []
                                  for para in m_deta_el.findall('para'):
                                      p_txt = get_text(para)
                                      if p_txt and not para.find('parameterlist') and not para.find('simplesect'):
                                          para_text.append(p_txt)
                                  if para_text:
                                      page.append(f"**Details:**\n\n" + "\n\n".join(para_text) + "\n\n")

                              # Extract Parameters (@param)
                              param_items = member.findall('.//parameteritem')
                              if param_items:
                                  page.append("**Parameters:**\n\n")
                                  page.append("| Parameter | Description |\n|:---|:---|\n")
                                  for p_item in param_items:
                                      p_name = get_text(p_item.find('.//parametername'))
                                      p_desc = get_text(p_item.find('.//parameterdescription'))
                                      page.append(f"| `{p_name}` | {p_desc} |\n")
                                  page.append("\n")

                              # Extract Return Value (@return)
                              returns = member.findall(".//simplesect[@kind='return']")
                              if returns:
                                  ret_desc = get_text(returns[0])
                                  if ret_desc:
                                      page.append(f"**Returns:** {ret_desc}\n\n")

                              page.append("---\n\n")

                  with open(os.path.join(out_dir, doc_filename), 'w', encoding='utf-8') as f:
                      f.write("".join(page))

          # Generate API-Reference.md Index
          with open(os.path.join(out_dir, 'API-Reference.md'), 'w', encoding='utf-8') as f:
              f.write("# API Reference Index\n\nAutomated list of library classes and modules:\n\n")
              for orig_name, clean_name, kind in sorted(pages, key=lambda x: x[0]):
                  f.write(f"- **[{orig_name}]({clean_name})** ({kind})\n")

          # Generate _Sidebar.md Navigation
          with open(os.path.join(out_dir, '_Sidebar.md'), 'w', encoding='utf-8') as f:
              f.write("### Navigation\n\n")
              f.write("- [Home](Home)\n")
              f.write("- [API Reference](API-Reference)\n\n")
              f.write("#### Classes & Modules\n\n")
              for orig_name, clean_name, _ in sorted(pages, key=lambda x: x[0]):
                  f.write(f"- [{orig_name}]({clean_name})\n")

          print("Generated detailed API Markdown pages, API-Reference.md, and _Sidebar.md")
          EOF

      - name: Checkout Wiki Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki_repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push to Wiki
        run: |
          # Copy generated markdown files into wiki_repo WITHOUT overwriting an existing Home.md
          rsync -av --exclude='Home.md' wiki_markdown/ wiki_repo/
          
          # Initialize Home.md if it does not exist yet in the wiki
          if [ ! -f wiki_repo/Home.md ]; then
            echo "# Welcome to the Library Wiki" > wiki_repo/Home.md
            echo "See the [API Reference](API-Reference) for detailed class documentation." >> wiki_repo/Home.md
          fi
          
          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update API documentation from Doxygen"
            git push
          else
            echo "No changes to commit to Wiki."
          fi
